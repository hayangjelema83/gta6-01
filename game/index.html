<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c1018;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1c2740 0%, #0c1018 70%);
  }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    background: #7fae5a;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
